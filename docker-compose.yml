services:
  db:
    image: postgres:16
    container_name: quiz-db
    environment:
      POSTGRES_DB: quiz
      POSTGRES_USER: quiz
      POSTGRES_PASSWORD: quiz
    volumes:
      - quiz-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quiz -d quiz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quiz-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      QUIZ_DB_HOST: db
      QUIZ_DB_PORT: 5432
      QUIZ_DB_NAME: quiz
      QUIZ_DB_USER: quiz
      QUIZ_DB_PASSWORD: quiz
      QUIZ_CACHE_CAPACITY: 100
      QUIZ_USER_ID: 1
      QUIZ_USE_COLORS: "true"
      QUIZ_LOG_LEVEL: info
    stdin_open: true
    tty: true
    restart: unless-stopped

volumes:
  quiz-data:
    driver: local
